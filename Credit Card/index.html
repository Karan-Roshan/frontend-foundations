<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Card - Ui Design</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="creditCard">
    <!-- Card Header -->
    <header>
      <div class="logo">
        <img src="Images/Master Card Logo.png" alt="Master Card Logo">
        <h1>Master Card</h1>
      </div>
      <div class="chip">
        <img src="Images/Chip.png" alt="Chip">
      </div>
    </header>

    <!-- Card Details -->
    <div class="card-details">
      <div class="name-number">
        <div class="cardNumber">
          <h2>Card Number</h2>
          <h3>8050 5040 2030 3020</h3>
        </div>

        <div class="cardName">
          <p>Karan Roshan</p>
        </div>
      </div>

      <div class="valid">
        <h5>Valid</h5>
        <h4>05/28</h4>
      </div>
    </div>
  </section>
</body>

</html>
