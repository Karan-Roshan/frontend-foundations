<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Ping</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <!-- Logo -->
  <section class="logo_section">
    <div class="logo">
      <img src="Images/Ping logo.svg" alt="Ping Logo">
    </div>
  </section>

  <!-- Details -->
  <section class="details_section">
    <div class="details">
      <h1>We are launching <span>Soon!</span></h1>
      <p>Subscribe and get notified</p>
    </div>
  </section>

  <!-- User Information -->
  <section class="Info_section">
    <form action="">
      <label for="email"></label>
      <input id="email" type="email" placeholder="Your email address" required>

      <button type="submit">Notify Me</button>
    </form>
  </section>

  <!-- Illustration Dashboard -->
  <section class="dashboard_section">
    <div class="dashboard">
      <img src="Images/Illustration Dashboard.png" alt="Illustration Dashboard">
    </div>
  </section>

  <!-- Social Media -->
  <section class="sociaMedia_section">
    <div class="sociaMedia">
      <i class="fa-brands fa-facebook" aria-label="Facebook"></i>
      <i class="fa-brands fa-instagram" aria-label="Instagram"></i>
      <i class="fa-brands fa-square-x-twitter" aria-label="Twitter"></i>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p class="attribution">
      &copy; Copyright Ping. All rights reserved.
      Coded by <a href="https://www.linkedin.com/in/karanroshan" target="_blank">Karan Roshan</a>.
    </p>
  </footer>
</body>

</html>
