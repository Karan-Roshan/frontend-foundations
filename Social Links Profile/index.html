<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Social links profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="socialProfile">
        <div class="profilePic">
            <img src="Images/Avatar Jessica.jpeg" alt="Profile photo of Jessica Randall, front-end developer">
        </div>

        <div class="info">
            <h1>Jessica Randall</h1>
            <p>London, United Kingdom</p>
        </div>

        <div class="jobRole">
            <p>"Front-end developer and avid reader."</p>
        </div>

        <div class="socialLink">
            <a href="https://github.com/" target="_blank" class="btn">Github</a>
            <a href="https://www.frontendmentor.io/" target="_blank" class="btn">Frontend Mentor</a>
            <a href="https://www.linkedin.com/" target="_blank" class="btn">Linkedin</a>
            <a href="https://x.com/" target="_blank" class="btn">Twitter</a>
            <a href="https://www.instagram.com/" target="_blank" class="btn">Instagram</a>
        </div>

    </section>
</body>

</html>
